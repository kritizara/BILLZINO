<h1 class="sr-only">Create your BillZino account</h1><body>

<div class="noise"></div>

<div class="auth-page">
  <div class="auth-glow" aria-hidden="true"></div>

  <a href="index.html" class="auth-brand reveal" data-reveal="0">
    <img src="assets/img/favicon-96.webp" alt="BillZino">
    <span>Bill<span class="accent">Zino</span></span>
  </a>
  <p class="auth-subtitle reveal" data-reveal="1">Create your account</p>

  <div class="auth-card reveal" data-reveal="2">
    <p class="auth-error" id="authError" hidden></p>
    <form class="auth-form" id="signupForm">
      <div class="auth-field">
        <label for="signupName">Name</label>
        <input type="text" id="signupName" name="name" placeholder="Jane Cooper" autocomplete="name" required>
      </div>
      <div class="auth-field">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" name="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="auth-field">
        <label for="signupPassword">Password</label>
        <div class="auth-input-wrap">
          <input type="password" id="signupPassword" name="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
          <button type="button" class="auth-eye-toggle" aria-label="Show password"></button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary auth-submit">Create account</button>
      <p class="auth-legal">By signing up, you agree to our <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.</p>
    </form>
  </div>

  <p class="auth-switch reveal" data-reveal="3">Already have an account? <a href="login.html">Log in</a></p>
  <p class="auth-switch-note reveal" data-reveal="4">Test accounts only for now — saved locally in this browser.</p>
</div>

<script src="js/auth.js?v=1" defer></script>
<script src="js/data.js?v=4" defer></script>
<script src="js/main.js?v=101" defer></script>
<script>
  document.getElementById('signupForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('authError');
    const result = billzinoAuth.signup({
      name: document.getElementById('signupName').value,
      email: document.getElementById('signupEmail').value,
      password: document.getElementById('signupPassword').value,
    });
    if (!result.ok) {
      errorEl.textContent = result.error;
      errorEl.hidden = false;
      return;
    }
    const pendingRaw = sessionStorage.getItem('billzino-pending-invoice');
    let wasSend = false;
    if (pendingRaw) {
      sessionStorage.removeItem('billzino-pending-invoice');
      try {
        const { invoiceData, action } = JSON.parse(pendingRaw);
        billzinoData.saveInvoice(result.session.userId, invoiceData, action === 'send');
        if (action === 'send') {
          wasSend = true;
          window.billzinoOpenInvoiceEmail(invoiceData);
        }
      } catch {}
    }
    setTimeout(() => { window.location.href = 'dashboard.html'; }, wasSend ? 400 : 0);
  });
</script>
</body>
</html>
